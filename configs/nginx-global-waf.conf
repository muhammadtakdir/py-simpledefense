# ==============================================================================
# py-simpledefense - Nginx WAF Rules & Hardening (Nginx 1.18+)
# Lokasi pemasangan: /etc/nginx/snippets/py-simpledefense-waf.conf
#
# Memblokir percobaan eksploitasi di level web server dengan HTTP 403 Forbidden
# sebelum request menyentuh PHP-FPM, Node.js, Python, atau database.
# ==============================================================================

# 1. Sembunyikan versi detail Nginx
server_tokens off;

# 2. Header keamanan dasar global
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# 3. Blokir akses ke berkas sensitif & repositori (.env, .git, config, backup, sql)
location ~* (^|/)(\.env|\.git|\.svn|\.bzr|\.hg) {
    return 403;
}

location ~* \.(bak|config|sql|fla|psd|ini|log|sh|inc|swp|dist)$ {
    return 403;
}

location ~* (composer\.(json|lock)|package\.(json|lock)|web\.config)$ {
    return 403;
}

# 4. Blokir probing panel database & berkas sensitif CMS yang tidak semestinya
location ~* /(phpmyadmin|pma|adminer|wp-config\.php|xmlrpc\.php) {
    return 403;
}

# 5. Blokir Path Traversal / Local File Inclusion (LFI) pada Request URI
location ~* (\.\./|\.\.\\|/etc/passwd|/etc/shadow|/proc/self/environ|win\.ini) {
    return 403;
}

# 6. Blokir User-Agent pemindai kerentanan otomatis
if ($http_user_agent ~* (nikto|sqlmap|acunetix|havij|nmap|dirbuster|gobuster|wpscan|nuclei)) {
    return 403;
}

# 7. Blokir SQL Injection pada Query String
if ($query_string ~* (union.*select|select.*from|into.*outfile|into.*dumpfile)) {
    return 403;
}
if ($query_string ~* (benchmark\s*\(|waitfor\s+delay|sleep\s*\(|load_file\s*\()) {
    return 403;
}
if ($query_string ~* (\b(drop|alter|truncate)\s+(table|database))) {
    return 403;
}

# 8. Blokir Path Traversal & File Inclusion pada Query String
if ($query_string ~* (\.\./|\.\.\\|/etc/passwd|/etc/shadow|/proc/self/environ|win\.ini)) {
    return 403;
}

# 9. Blokir Injeksi Fungsi PHP & Webshell pada Query String
if ($query_string ~* (eval\s*\(|base64_decode\s*\(|passthru\s*\(|shell_exec\s*\(|system\s*\(|assert\s*\()) {
    return 403;
}
if ($query_string ~* (php://input|data://text|phar://)) {
    return 403;
}

# 10. Blokir Reflected Cross-Site Scripting (XSS) pada Query String
if ($query_string ~* (<script|%3Cscript|javascript:|alert\s*\(|onerror=|onload=|<svg|%3Csvg)) {
    return 403;
}
