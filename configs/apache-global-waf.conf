# ==============================================================================
# py-simpledefense - GLOBAL WEB HARDENING & REWRITE BLOCKING (APACHE 2.4)
# Lokasi pemasangan: /etc/apache2/conf-available/py-simpledefense-waf.conf
#
# Mengembalikan respons HTTP 403 Forbidden langsung di level C Apache sebelum
# request menyentuh PHP-FPM, aplikasi, atau database.
# ==============================================================================

# 1. Sembunyikan versi detail web server pada header dan halaman error
ServerTokens Prod
ServerSignature Off

# 2. Header keamanan dasar global
<IfModule mod_headers.c>
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
</IfModule>

# 3. Perisai Rewrite pada direktori aplikasi web (/var/www/)
<Directory /var/www/>
    <IfModule mod_rewrite.c>
        RewriteEngine On
        # Pastikan aturan global ini tetap dieksekusi meskipun aplikasi memiliki .htaccess sendiri
        RewriteOptions InheritDownBefore

        # A. Blokir akses ke berkas sensitif & repositori (.env, .git, .svn, backup, config)
        RewriteRule (?i)(^|/)(\.env|\.git|\.svn|\.bzr|\.hg) - [F,L]
        RewriteRule (?i)\.(bak|config|sql|fla|psd|ini|log|sh|inc|swp|dist)$ - [F,L]
        RewriteRule (?i)(composer\.(json|lock)|package\.(json|lock)|web\.config) - [F,L]

        # B. Blokir probing panel database & berkas sensitif CMS
        RewriteRule (?i)(phpmyadmin|pma|adminer|wp-config\.php|xmlrpc\.php) - [F,L]

        # C. Blokir pola SQL Injection pada Query String
        RewriteCond %{QUERY_STRING} (?i)(union.*select|select.*from|into.*outfile|into.*dumpfile) [NC,OR]
        RewriteCond %{QUERY_STRING} (?i)(benchmark\s*\(|waitfor\s+delay|sleep\s*\(|load_file\s*\() [NC,OR]
        RewriteCond %{QUERY_STRING} (?i)(\b(drop|alter|truncate)\s+(table|database)) [NC]
        RewriteRule ^.*$ - [F,L]

        # D. Blokir Path Traversal / Local File Inclusion (LFI)
        RewriteCond %{QUERY_STRING} (?i)(\.\./|\.\.\\|/etc/passwd|/etc/shadow|/proc/self/environ|win\.ini) [NC,OR]
        RewriteCond %{REQUEST_URI} (?i)(\.\./|\.\.\\|/etc/passwd|/etc/shadow|/proc/self/environ|win\.ini) [NC]
        RewriteRule ^.*$ - [F,L]

        # E. Blokir injeksi kode PHP & pemanggilan webshell pada Query String
        RewriteCond %{QUERY_STRING} (?i)(eval\s*\(|base64_decode\s*\(|passthru\s*\(|shell_exec\s*\(|system\s*\(|assert\s*\() [NC,OR]
        RewriteCond %{QUERY_STRING} (?i)(php://input|data://text|phar://) [NC]
        RewriteRule ^.*$ - [F,L]

        # F. Blokir Reflected Cross-Site Scripting (XSS) pada Query String
        RewriteCond %{QUERY_STRING} (?i)(<script|%3Cscript|javascript:|alert\s*\(|onerror=|onload=|<svg|%3Csvg) [NC]
        RewriteRule ^.*$ - [F,L]

        # G. Blokir User-Agent pemindai kerentanan otomatis
        RewriteCond %{HTTP_USER_AGENT} (?i)(nikto|sqlmap|acunetix|havij|nmap|dirbuster|gobuster|wpscan|nuclei) [NC]
        RewriteRule ^.*$ - [F,L]
    </IfModule>
</Directory>
